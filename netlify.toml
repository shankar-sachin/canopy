# Netlify: serves the website (docs/) and the one-line installers.
#
#   curl -fsSL https://gitcanopy.netlify.app/install.sh | sh
#   irm https://gitcanopy.netlify.app/install.ps1 | iex
#
# The scripts live in scripts/; the build copies them next to the site so
# they're served from its root. (docs/install.* are generated, not committed.)
[build]
  publish = "docs"
  command = "cp scripts/install.sh scripts/install.ps1 scripts/install-desktop.sh scripts/install-desktop.ps1 docs/"

[[headers]]
  for = "/install*.sh"
  [headers.values]
    Content-Type = "text/x-shellscript; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/install*.ps1"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
