[package]
name = "canopy-git-tui"
description = "Canopy for the terminal: git and GitHub, everything from the keyboard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy-git = { path = "../canopy-git" }
anyhow.workspace = true
tokio.workspace = true
ratatui = "0.30.2"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
directories = "6.0.0"
canopy-gh = { path = "../canopy-gh" }
canopy-config = { path = "../canopy-config" }
canopy-highlight = { path = "../canopy-highlight" }

[dev-dependencies]
tempfile.workspace = true
