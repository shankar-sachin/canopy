[package]
name = "canopy-desktop"
description = "Canopy Desktop: the Canopy git dashboard as a desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
canopy-git = { path = "../canopy-git", features = ["serde"] }
canopy-gh = { path = "../canopy-gh" }
anyhow.workspace = true
tokio.workspace = true
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile.workspace = true

[features]
# Serve the UI from inside the app (release builds). The Tauri CLI turns it
# on for `cargo tauri build`; a plain `cargo build --features custom-protocol`
# works too.
custom-protocol = ["tauri/custom-protocol"]
