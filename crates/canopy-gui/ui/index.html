<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canopy</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- Shown until a repository is open. -->
<div id="welcome" class="welcome" hidden>
  <div class="drag-strip" data-tauri-drag-region></div>
  <div class="welcome-in">
    <img class="welcome-logo" src="logo.svg" alt="" width="84" height="84">
    <h1>canopy</h1>
    <p class="welcome-sub">A beautiful, powerful git dashboard.</p>
    <button class="btn primary big" id="open-btn" type="button">Open a repository… <kbd class="k">⌘O</kbd></button>
    <div class="recent" id="recent"></div>
    <button class="btn ghost small welcome-settings" id="welcome-settings" type="button">Settings</button>
  </div>
</div>

<div id="shell" class="shell" hidden>
  <aside class="sidebar">
    <div class="side-top" data-tauri-drag-region></div>
    <button class="repo-switch" id="repo-switch" type="button" title="Switch repository (⌘O)">
      <img src="logo.svg" alt="" width="28" height="28">
      <span class="repo-names"><b id="repo-name"></b><small id="repo-branch"></small></span>
      <svg class="chev" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="me">
        <button class="me-btn" id="me" type="button" title="Your git and GitHub account">
          <span class="avatar" id="avatar"></span>
          <span class="me-names"><b id="me-name">…</b><small id="me-sub"></small></span>
        </button>
        <button class="btn icon ghost gear" id="settings-btn" type="button" title="Settings (⌘,)">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg>
          <span class="update-dot" id="update-dot" hidden title="An update is available"></span>
        </button>
      </div>
      <span class="version" id="version"></span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" data-tauri-drag-region>
      <h2 id="page-title" data-tauri-drag-region>Home</h2>
      <div class="top-actions">
        <span class="sync" id="sync"></span>
        <div class="btn-group">
          <button class="btn" data-sync="fetch" type="button" title="Fetch from all remotes">Fetch</button>
          <button class="btn" data-sync="pull" type="button" title="Pull this branch">Pull</button>
          <button class="btn" data-sync="push" type="button" title="Push this branch">Push</button>
        </div>
        <button class="btn icon" id="undo" type="button" title="Undo the last commit, reset or checkout (⌘Z)">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M5.5 3.5 2.5 6.5l3 3M2.5 6.5h7a4 4 0 0 1 0 8h-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn icon" id="refresh" type="button" title="Refresh (⌘R)">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<div class="progress" id="progress" hidden><i></i><b></b><span class="mono"></span></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="app.js"></script>
<script src="changes.js"></script>
<script src="history.js"></script>
<script src="branches.js"></script>
<script src="stash.js"></script>
<script src="github.js"></script>
<script src="settings.js"></script>
</body>
</html>
