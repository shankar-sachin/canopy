name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything must pass on all three platforms.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install the desktop app's Linux libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev xvfb
      - name: Configure git for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # Every dependency's license is allowed, and THIRD-PARTY-LICENSES.txt is current.
      - name: Third-party licenses
        if: runner.os == 'Linux'
        run: node scripts/third-party.mjs --check
      - name: Run the binary
        run: cargo run --release -- --version
      # Opens the desktop app on this repo, renders Home, and quits.
      - name: Desktop app smoke test (macOS)
        if: runner.os == 'macOS'
        run: cargo run -p canopy-desktop -- --smoke .
      - name: Desktop app smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo run -p canopy-desktop -- --smoke .
      # Windows 11 has WebView2 built in; the runner image has it too.
      - name: Desktop app smoke test (Windows)
        if: runner.os == 'Windows'
        run: cargo run -p canopy-desktop -- --smoke .
      # An empty folder: the app offers to start a repository, runs git init
      # with starter files and a first commit, then opens it.
      - name: Desktop app smoke test, new repository
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fresh-repo"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a cargo run -p canopy-desktop -- --smoke "$RUNNER_TEMP/fresh-repo"
          else
            cargo run -p canopy-desktop -- --smoke "$RUNNER_TEMP/fresh-repo"
          fi

  # The desktop app's JavaScript and the website. Plain Node (on the runner
  # already), nothing from npm.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Desktop UI tests (syntax of every script, then ui-tests)
        run: node --version && scripts/test-ui.sh
      - name: Website audit (links, anchors, head tags, search index, version)
        run: node scripts/audit-site.mjs

  # Releases ship a Windows on Arm build; make sure it still builds.
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target aarch64-pc-windows-msvc -p canopy-git-tui
