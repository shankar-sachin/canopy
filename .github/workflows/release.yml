name: Release

# Push a tag like v0.1.0 to publish a GitHub release and update the
# Homebrew tap (shankar-sachin/homebrew-canopy). Create the release yourself
# right after pushing the tag so it's credited to you (see the release job).
#
# Requires the repository secret HOMEBREW_TAP_DEPLOY_KEY: the private half of
# an SSH deploy key that has write access to homebrew-canopy only.

on:
  push:
    tags: ["v*"]
  # Run by hand to build everything without releasing (a dry run).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p canopy-git-tui
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          name=canopy-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/canopy README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "canopy-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/canopy.exe", README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            canopy-*.tar.gz*
            canopy-*.zip*

  # Canopy Desktop: a .dmg per Mac architecture, and a .deb and an AppImage
  # for Linux. Not public yet: releases include it only once the repository
  # variable DESKTOP_PUBLIC is "true" (after the Mac app is notarized).
  # Running this workflow by hand always builds it, as a dry run.
  desktop:
    if: ${{ vars.DESKTOP_PUBLIC == 'true' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            bundles: dmg
          - target: x86_64-unknown-linux-gnu
            # The oldest supported Ubuntu, so the builds run on older glibc.
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Linux build libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev file
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build
        working-directory: crates/canopy-gui
        run: cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --features custom-protocol
      - name: Collect
        shell: bash
        run: |
          v=${{ github.ref_name }}
          b=target/${{ matrix.target }}/release/bundle
          shopt -s nullglob
          for f in $b/dmg/*.dmg; do cp "$f" "canopy-desktop-$v-${{ matrix.target }}.dmg"; done
          for f in $b/deb/*.deb; do cp "$f" "canopy-desktop-$v-amd64.deb"; done
          for f in $b/appimage/*.AppImage; do cp "$f" "canopy-desktop-$v-x86_64.AppImage"; done
          for f in canopy-desktop-*; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la canopy-desktop-*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: canopy-desktop-*

  release:
    needs: [build, desktop]
    # The terminal app ships even if a desktop build fails.
    if: ${{ !cancelled() && needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      # The release is normally created by the maintainer right after pushing
      # the tag (`gh release create vX.Y.Z --generate-notes --title "Canopy
      # vX.Y.Z"`), so it's credited to them rather than github-actions. This
      # step then just attaches the builds, or creates the release if nobody
      # did.
      - name: Attach builds to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(canopy-*.tar.gz* canopy-*.zip* canopy-desktop-*)
          repo="${{ github.repository }}"
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$repo" --generate-notes --title "Canopy $tag"
          fi

  homebrew:
    needs: [release, desktop]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing to download while the desktop app isn't public.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: desktop-*-apple-darwin
          merge-multiple: true
          path: desktop
      - name: Compute source tarball checksum
        id: src
        run: |
          url="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz"
          sha=$(curl -sL "$url" | shasum -a 256 | cut -d' ' -f1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: shankar-sachin/homebrew-canopy
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update formula
        run: |
          mkdir -p tap/Formula
          sed -e "s|@URL@|${{ steps.src.outputs.url }}|" \
              -e "s|@SHA256@|${{ steps.src.outputs.sha }}|" \
              packaging/homebrew/canopy.rb.in > tap/Formula/canopy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/canopy.rb
          # The desktop app's cask, when both Mac builds made it.
          v=${{ github.ref_name }}
          arm=../desktop/canopy-desktop-$v-aarch64-apple-darwin.dmg.sha256
          intel=../desktop/canopy-desktop-$v-x86_64-apple-darwin.dmg.sha256
          if [ -f "$arm" ] && [ -f "$intel" ]; then
            mkdir -p Casks
            sed -e "s|@VERSION@|${v#v}|" \
                -e "s|@SHA_ARM@|$(cut -d' ' -f1 "$arm")|" \
                -e "s|@SHA_INTEL@|$(cut -d' ' -f1 "$intel")|" \
                ../packaging/homebrew/canopy-desktop.rb.in > Casks/canopy-desktop.rb
            git add Casks/canopy-desktop.rb
          fi
          git commit -m "canopy ${{ github.ref_name }}"
          git push
